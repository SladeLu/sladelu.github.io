  copy_text: "Rui Lu is a postdoctoral researcher at The Hong Kong Polytechnic University, starting in December 2024. He completed his Ph.D. in 2024 from the Department of Computing at The Hong Kong Polytechnic University. Before that, he graduated with a B.Eng in Computer Science and Technology from the Southern University of Science and Technology in 2019. His research interests are in edge computing systems and sustainable computing, particularly in performance optimization, privacy-preserving system design, and energy-efficient computing for emerging applications such as video analytics and large language model inference."
  body: |-
    I am currently a postdoctoral researcher, starting in Jan. 2025. I completed my Ph.D. in Dec. 2024 from the Department of Computing at The Hong Kong Polytechnic University ([HK PolyU](https://www.polyu.edu.hk/)).
    Before that, I graduated with a B.Eng in Computer Science and Technology from the Southern University of Science and Technology ([SUSTech](https://www.sustech.edu.cn/en/)) in 2019.
    My research interests are in edge/cloud computing and sustainable computing, particularly in performance optimization, privacy-preserving, and energy-efficieny for emerging applications such as video analytics and large language model inference.

