  copy_text: "卢睿目前是香港理工大学博士后研究员，于 2024 年 12 月入职。他于 2024 年在香港理工大学计算机系获得博士学位。此前，他于 2019 年毕业于南方科技大学，获得计算机科学与技术学士学位。他的研究兴趣包括边缘计算系统与可持续计算，尤其关注面向视频分析和大语言模型推理等新兴应用的性能优化、隐私保护系统设计和能效优化。"
  body: |-
    我目前是一名博士后研究员。我于 2024 年在香港理工大学计算机系获得博士学位([HK PolyU](https://www.polyu.edu.hk/))。在此之前，我于 2019 年毕业于南方科技大学([SUSTech](https://www.sustech.edu.cn/en/))，获得计算机科学与技术学士学位。
    我的研究兴趣包括边缘计算系统与可持续计算，尤其关注面向视频分析和大语言模型推理等新兴应用的性能优化、隐私保护系统设计和能效优化。
